apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    # The log-processing agent mounts the host /var/log read-only, which the
    # baseline policy forbids. Keep the namespace scoped to CrowdSec only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
