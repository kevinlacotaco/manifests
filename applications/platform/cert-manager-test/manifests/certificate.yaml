apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-test
  namespace: cert-manager-test
spec:
  secretName: cert-manager-test-tls
  duration: 2160h
  renewBefore: 360h
  commonName: cert-manager-test.home.arpa
  dnsNames:
    - cert-manager-test.home.arpa
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
