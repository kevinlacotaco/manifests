apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allows traffic to PostgreSQL port 5432 from explicitly authorized pods
    - from:
        # Apps running in the default namespace
        - podSelector:
            matchLabels:
              requires-db: postgres
        # Apps running in their own namespace
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - mealie
                  - donetick
                  - ntfy
          podSelector:
            matchLabels:
              requires-db: postgres
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # 2. Block all outbound traffic except CoreDNS for basic lookups if needed
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
