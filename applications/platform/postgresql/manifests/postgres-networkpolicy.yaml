apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allows traffic to PostgreSQL port 5432 from explicitly authorized pods
    - from:
        # Same-namespace clients, such as the database init Job
        - podSelector:
            matchLabels:
              requires-db: postgres
        # Forgejo's chart does not expose pod labels, so select its pod by
        # the chart's stable app label instead of requires-db.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
        # Applications running in their own namespaces
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - mealie
                  - donetick
                  - paperless
                  - backup
                  - speedtest-tracker
                  - auth
          podSelector:
            matchLabels:
              requires-db: postgres
        # Prometheus Postgres exporter.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-postgres-exporter
        # Uptime Kuma runs a TCP-only health check from the monitoring namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # 2. Block all outbound traffic except CoreDNS for basic lookups if needed
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
