apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-apps
  namespace: database
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: postgres-init
        requires-db: postgres
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: init-databases
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
              value: postgres-headless-service.database.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-db
            - name: MEALIE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: mealie-db-password
            - name: DONETICK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: donetick-db-password
            - name: PAPERLESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: paperless-db-password
            - name: SPEEDTEST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: speedtest-db-password
            - name: AUTHELIA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: authelia-db-password
            - name: FORGEJO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: forgejo-db-password
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secrets
                  key: postgres-exporter-password
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                echo "waiting for PostgreSQL at $PGHOST:$PGPORT"
                sleep 2
              done

              psql -v ON_ERROR_STOP=1 \
                -v mealie_password="$MEALIE_DB_PASSWORD" \
                -v donetick_password="$DONETICK_DB_PASSWORD" \
                -v paperless_password="$PAPERLESS_DB_PASSWORD" \
                -v speedtest_password="$SPEEDTEST_DB_PASSWORD" \
                -v authelia_password="$AUTHELIA_DB_PASSWORD" \
                -v forgejo_password="$FORGEJO_DB_PASSWORD" \
                -v postgres_exporter_password="$POSTGRES_EXPORTER_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE mealie LOGIN PASSWORD %L', :'mealie_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mealie')\gexec
              ALTER ROLE mealie WITH LOGIN PASSWORD :'mealie_password';

              SELECT format('CREATE ROLE donetick LOGIN PASSWORD %L', :'donetick_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'donetick')\gexec
              ALTER ROLE donetick WITH LOGIN PASSWORD :'donetick_password';

              SELECT format('CREATE ROLE paperless LOGIN PASSWORD %L', :'paperless_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paperless')\gexec
              ALTER ROLE paperless WITH LOGIN PASSWORD :'paperless_password';

              SELECT format('CREATE ROLE speedtest LOGIN PASSWORD %L', :'speedtest_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'speedtest')\gexec
              ALTER ROLE speedtest WITH LOGIN PASSWORD :'speedtest_password';

              SELECT format('CREATE ROLE authelia LOGIN PASSWORD %L', :'authelia_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authelia')\gexec
              ALTER ROLE authelia WITH LOGIN PASSWORD :'authelia_password';

              SELECT format('CREATE ROLE forgejo LOGIN PASSWORD %L', :'forgejo_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'forgejo')\gexec
              ALTER ROLE forgejo WITH LOGIN PASSWORD :'forgejo_password';

              SELECT format('CREATE ROLE postgres_exporter LOGIN PASSWORD %L', :'postgres_exporter_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgres_exporter')\gexec
              ALTER ROLE postgres_exporter WITH LOGIN PASSWORD :'postgres_exporter_password';
              GRANT pg_monitor TO postgres_exporter;

              SELECT 'CREATE DATABASE mealie OWNER mealie'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'mealie')\gexec
              SELECT 'CREATE DATABASE donetick OWNER donetick'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'donetick')\gexec
              SELECT 'CREATE DATABASE paperless OWNER paperless'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'paperless')\gexec
              SELECT 'CREATE DATABASE speedtest OWNER speedtest'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'speedtest')\gexec
              SELECT 'CREATE DATABASE authelia OWNER authelia'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'authelia')\gexec
              SELECT 'CREATE DATABASE forgejo OWNER forgejo'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'forgejo')\gexec

              \c mealie
              ALTER SCHEMA public OWNER TO mealie;
              GRANT ALL ON SCHEMA public TO mealie;

              \c donetick
              ALTER SCHEMA public OWNER TO donetick;
              GRANT ALL ON SCHEMA public TO donetick;

              \c paperless
              ALTER SCHEMA public OWNER TO paperless;
              GRANT ALL ON SCHEMA public TO paperless;

              \c speedtest
              ALTER SCHEMA public OWNER TO speedtest;
              GRANT ALL ON SCHEMA public TO speedtest;

              \c authelia
              ALTER SCHEMA public OWNER TO authelia;
              GRANT ALL ON SCHEMA public TO authelia;

              \c forgejo
              ALTER SCHEMA public OWNER TO forgejo;
              GRANT ALL ON SCHEMA public TO forgejo;
              SQL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
