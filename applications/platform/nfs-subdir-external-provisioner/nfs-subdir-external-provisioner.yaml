apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-subdir-provisioner
  namespace: argocd
spec:
  project: platform

  source:
    repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18

    helm:
      values: |
        nfs:
          server: 192.168.68.138
          path: /volume1/k8s-nfs
          # NFSv4.1 is the normal protocol. The earlier write failures were
          # caused by the Synology Windows ACL, not by idmap; the export now
          # allows the non-root pod UIDs. New PVs inherit this mount option.
          mountOptions:
            - vers=4.1

        storageClass:
          name: synology-nfs-subdir
          defaultClass: true
          accessModes: ReadWriteMany
          reclaimPolicy: Retain

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi

        labels:
          argocd.argoproj.io/instance: nfs-subdir-provisioner

  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-provisioner

  ignoreDifferences:
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: apps
      kind: Deployment
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: rbac.authorization.k8s.io
      kind: Role
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: storage.k8s.io
      kind: StorageClass
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
