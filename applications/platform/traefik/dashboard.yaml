apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-allowlist
  namespace: kube-system
spec:
  ipWhiteList:
    sourceRange:
      - 192.168.68.0/24
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: kube-system
spec:
  basicAuth:
    secret: traefik-dashboard-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - traefik
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: traefik-dashboard-allowlist
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
