apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    additionalArguments:
      - "--api.insecure=true"
      # k3s servicelb (klipper-lb) masquerades LoadBalancer traffic, so Traefik sees
      # the svclb pod IP rather than the Synology source. Trust the cluster pod CIDR.
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.42.0.0/16,192.168.68.138/32"
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      argocd:
        port: 8081
        expose:
          default: true
        exposedPort: 8081
        protocol: TCP
      traefik:
        port: 8080
        expose:
          default: true
        exposedPort: 8080
        protocol: TCP
      grafana:
        port: 3000
        expose:
          default: true
        exposedPort: 3000
        protocol: TCP
      mqtt:
        port: 1883
        expose:
          default: true
        exposedPort: 1883
        protocol: TCP
