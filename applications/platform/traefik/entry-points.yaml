apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # CrowdSec bouncer plugin. The plugin is downloaded from the Traefik
    # plugin catalog at startup, so Traefik needs egress access to GitHub.
    experimental:
      plugins:
        crowdsec:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.8.2
    # The bouncer key is mounted from the SealedSecret in kube-system and read
    # with crowdsecLapiKeyFile, so the key is never inlined in the Middleware.
    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        type: secret
    # CrowdSec parses Traefik's JSON access logs. Drop headers by default so
    # cookies and Authorization never reach the log pipeline.
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
    additionalArguments:
      # The dashboard is served by an authenticated IngressRoute on the traefik
      # entrypoint; the insecure API must stay disabled.
      - "--api.dashboard=true"
      # k3s servicelb (klipper-lb) masquerades LoadBalancer traffic, so Traefik sees
      # the svclb pod IP rather than the Synology source. Trust the cluster pod CIDR.
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.42.0.0/16,192.168.68.138/32"
      - "--entryPoints.web.http.middlewares=kube-system-crowdsec-bouncer@kubernetescrd"
      - "--entryPoints.websecure.http.middlewares=kube-system-crowdsec-bouncer@kubernetescrd"
    ingressRoute:
      dashboard:
        enabled: false
    ports:
      argocd:
        port: 8081
        expose:
          default: true
        exposedPort: 8081
        protocol: TCP
      traefik:
        port: 8080
        expose:
          default: true
        exposedPort: 8080
        protocol: TCP
      grafana:
        port: 3000
        expose:
          default: true
        exposedPort: 3000
        protocol: TCP
      mqtt:
        port: 1883
        expose:
          default: true
        exposedPort: 1883
        protocol: TCP
