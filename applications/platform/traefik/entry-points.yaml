apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Keep ingress available through a single Traefik pod failure or rollout.
    # maxUnavailable is used instead of minAvailable so a temporary scale-down
    # to one replica cannot block node drains.
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-kube-system
              topologyKey: kubernetes.io/hostname
    # CrowdSec bouncer plugin. The plugin is downloaded from the Traefik
    # plugin catalog at startup, so Traefik needs egress access to GitHub.
    experimental:
      plugins:
        crowdsec:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.8.2
        # US-only geoblock. Lookups use get.geojs.io; Traefik therefore needs
        # egress to that host in addition to GitHub for plugin downloads.
        geoblock:
          moduleName: github.com/PascalMinder/geoblock
          version: v0.3.8
    # The bouncer key is mounted from the SealedSecret in kube-system and read
    # with crowdsecLapiKeyFile, so the key is never inlined in the Middleware.
    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        type: secret
    # CrowdSec parses Traefik's JSON access logs. Drop headers by default so
    # cookies and Authorization never reach the log pipeline.
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
    additionalArguments:
      # The dashboard is served by an authenticated IngressRoute on websecure.
      # The traefik entrypoint stays internal for /ping probes; the insecure API
      # must remain disabled.
      - "--api.dashboard=true"
      # k3s servicelb (klipper-lb) masquerades LoadBalancer traffic, so Traefik sees
      # the svclb pod IP rather than the Synology source. Trust the cluster pod CIDR.
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.42.0.0/16,192.168.68.138/32"
      - "--entryPoints.web.http.middlewares=kube-system-crowdsec-bouncer@kubernetescrd,kube-system-geoblock@kubernetescrd"
      - "--entryPoints.websecure.http.middlewares=kube-system-crowdsec-bouncer@kubernetescrd,kube-system-geoblock@kubernetescrd"
    ingressRoute:
      dashboard:
        enabled: false
    ports:
      traefik:
        port: 8080
        # Keep the entrypoint inside the pod for /ping health probes, but do
        # not publish it as a Traefik Service port.
        expose:
          default: false
        exposedPort: 8080
        protocol: TCP
      mqtt:
        port: 1883
        expose:
          default: true
        exposedPort: 1883
        protocol: TCP
