apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    additionalArguments:
      - "--api.insecure=true"
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      argocd:
        port: 8081
        expose:
          default: true
        exposedPort: 8081
        protocol: TCP
      traefik:
        port: 8080
        expose:
          default: true
        exposedPort: 8080
        protocol: TCP
      grafana:
        port: 3000
        expose:
          default: true
        exposedPort: 3000
        protocol: TCP
