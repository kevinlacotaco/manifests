apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipHealthCheck
spec:
  description: Cluster infrastructure and shared services
  sourceRepos:
    - git@github.com:kevinlacotaco/manifests.git
    - https://charts.jetstack.io
    - https://argoproj.github.io/argo-helm
    - https://bitnami.github.io/sealed-secrets
    - https://christian-schlichtherle.github.io/synology-csi-chart
    - https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    - https://github.com/rabbitmq/cluster-operator
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: synology-csi
    - server: https://kubernetes.default.svc
      namespace: nfs-provisioner
    - server: https://kubernetes.default.svc
      namespace: rabbitmq-system
    - server: https://kubernetes.default.svc
      namespace: messaging
    - server: https://kubernetes.default.svc
      namespace: database
    - server: https://kubernetes.default.svc
      namespace: auth
    - server: https://kubernetes.default.svc
      namespace: backup
    - server: https://kubernetes.default.svc
      namespace: renovate
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cert-manager-test
    - server: https://kubernetes.default.svc
      namespace: kyverno
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
