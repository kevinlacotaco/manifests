apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-config-backup
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-config-backup
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-config-backup
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-config-backup
subjects:
  - kind: ServiceAccount
    name: app-config-backup
    namespace: backup
---
