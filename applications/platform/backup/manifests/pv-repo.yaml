apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-kopia-repo
  labels:
    app.kubernetes.io/name: kopia
    app.kubernetes.io/component: repository
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    namespace: backup
    name: kopia-repo
  nfs:
    server: 192.168.68.138
    path: /volume1/k8s-backups
    readOnly: false
  mountOptions:
    - vers=4.1
