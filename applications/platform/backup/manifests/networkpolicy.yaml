apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: backup
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress
  namespace: backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kopia
  policyTypes:
    - Egress
  egress:
    # DNS for the PostgreSQL service name and any future remote targets.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Logical database dumps are taken over the network from PostgreSQL.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
    # NFS mount traffic to the Synology backup and Mealie media exports.
    - to:
        - ipBlock:
            cidr: 192.168.68.138/32
      ports:
        - protocol: TCP
          port: 2049
        - protocol: UDP
          port: 2049
