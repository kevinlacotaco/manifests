apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-config-backup
  namespace: backup
spec:
  schedule: "30 0 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: app-config-backup
        spec:
          serviceAccountName: app-config-backup
          restartPolicy: Never
          containers:
            - name: snapshot
              image: alpine/k8s:1.31.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: TZ
                  value: America/New_York
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: repo
                  mountPath: /repo
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: repo
              persistentVolumeClaim:
                claimName: kopia-repo
            - name: scripts
              configMap:
                name: app-config-backup
                defaultMode: 0755
