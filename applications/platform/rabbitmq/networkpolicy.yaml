apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  namespace: messaging
spec:
  # The messaging namespace currently contains only the RabbitMQ StatefulSet.
  # An empty selector avoids Kustomize's includeSelectors rewriting the
  # selector with labels the operator-managed pods do not carry.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # AMQP, clustering, management, and Prometheus scraping.
    - ports:
        - port: 4369
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 5671
          protocol: TCP
        - port: 25672
          protocol: TCP
        - port: 15672
          protocol: TCP
        - port: 15692
          protocol: TCP
    # MQTT is reachable only through the Traefik TCP entrypoint and the
    # in-cluster radio, Frigate, Home Assistant, and Govee namespaces.
    - from:
        - ipBlock:
            cidr: 192.168.68.0/24
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: radio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frigate
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: govee2mqtt
        # Allow the trusted monitoring namespace to check the MQTT listener.
        # The RabbitMQ kustomization injects its component label into
        # podSelectors, so use a namespace selector instead of a pod label.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 1883
          protocol: TCP
  egress:
    - {}
