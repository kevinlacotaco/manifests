apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rabbitmq-mqtt
  namespace: messaging
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`*`)
      services:
        # Stable broker entrypoint. The backing Service can be repointed from
        # Mosquitto to another broker without changing external clients.
        - name: mqtt
          port: 1883
