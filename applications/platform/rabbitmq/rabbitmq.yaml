apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: messaging
spec:
  replicas: 1

  # Pin the broker image instead of relying on the operator's default.
  image: rabbitmq:4.1.3-management

  persistence:
    storageClassName: synology-iscsi
    storage: 20Gi

  rabbitmq:
    additionalConfig: |
      log.console.level = info
      disk_free_limit.absolute = 2GB

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
