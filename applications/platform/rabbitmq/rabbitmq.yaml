apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: messaging
spec:
  replicas: 1

  # Pin the broker image instead of relying on the operator's default.
  image: rabbitmq:4.1.3-management

  persistence:
    storageClassName: synology-iscsi
    storage: 20Gi

  rabbitmq:
    additionalPlugins:
      - rabbitmq_mqtt
    additionalConfig: |
      log.console.level = info
      disk_free_limit.absolute = 2GB
      mqtt.listeners.tcp.default = 1883
      mqtt.allow_anonymous = false
      mqtt.vhost = /
      mqtt.exchange = amq.topic

  override:
    service:
      spec:
        ports:
          - name: mqtt
            port: 1883
            targetPort: 1883
            protocol: TCP

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
