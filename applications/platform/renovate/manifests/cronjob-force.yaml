apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-force
  namespace: renovate
spec:
  schedule: 0 3 * * *
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: renovate
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: false
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          - name: token-generator
            image: alpine:3.20
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            env:
            - name: APP_ID
              valueFrom:
                secretKeyRef:
                  name: renovate-github-app
                  key: app-id
            - name: INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: renovate-github-app
                  key: installation-id
            command:
            - /bin/sh
            - -ec
            - "set -eu\napk add --no-cache openssl curl jq >/dev/null\n\nnow=$(date\
              \ +%s)\niat=$((now - 60))\nexp=$((now + 540))\n\nheader=$(printf '{\"\
              alg\":\"RS256\",\"typ\":\"JWT\"}' \\\n  | openssl base64 -A | tr '+/'\
              \ '-_' | tr -d '=')\npayload=$(printf '{\"iat\":%d,\"exp\":%d,\"iss\"\
              :\"%s\"}' \"$iat\" \"$exp\" \"$APP_ID\" \\\n  | openssl base64 -A |\
              \ tr '+/' '-_' | tr -d '=')\nsignature=$(printf '%s.%s' \"$header\"\
              \ \"$payload\" \\\n  | openssl dgst -sha256 -sign /app-key/private-key.pem\
              \ \\\n  | openssl base64 -A | tr '+/' '-_' | tr -d '=')\n\ntoken=$(curl\
              \ -fsS -X POST \\\n  -H \"Authorization: Bearer ${header}.${payload}.${signature}\"\
              \ \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens\"\
              \ \\\n  | jq -er .token)\n\nprintf '%s' \"$token\" > /run/renovate/token\n\
              chmod 0644 /run/renovate/token\ntest -s /run/renovate/token\n"
            volumeMounts:
            - name: app-key
              mountPath: /app-key
              readOnly: true
            - name: token
              mountPath: /run/renovate
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
          containers:
          - name: renovate
            image: renovate/renovate:44.225.0
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            command:
            - /bin/sh
            - -c
            args:
            - 'export RENOVATE_TOKEN="$(cat /run/renovate/token)"

              exec renovate

              '
            env:
            - name: RENOVATE_PLATFORM
              value: github
            - name: RENOVATE_REPOSITORIES
              value: kevinlacotaco/manifests
            - name: RENOVATE_AUTODISCOVER
              value: 'false'
            - name: RENOVATE_ONBOARDING
              value: 'false'
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/New_York
            - name: HOME
              value: /tmp
            - name: RENOVATE_FORCE
              value: '{"schedule":[]}'
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: token
              mountPath: /run/renovate
              readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          - name: token
            emptyDir:
              sizeLimit: 1Mi
          - name: app-key
            secret:
              secretName: renovate-github-app
              items:
              - key: private-key
                path: private-key.pem
