apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Enabled after the renovate-github-app Secret is sealed in this namespace.
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: renovate
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            # The init container needs root to install the token helper
            # packages. The Renovate container itself runs as UID 1000.
            runAsNonRoot: false
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: token-generator
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: app-id
                - name: INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: installation-id
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  apk add --no-cache openssl curl jq >/dev/null

                  now=$(date +%s)
                  iat=$((now - 60))
                  exp=$((now + 540))

                  header=$(printf '{"alg":"RS256","typ":"JWT"}' \
                    | openssl base64 -A | tr '+/' '-_' | tr -d '=')
                  payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$iat" "$exp" "$APP_ID" \
                    | openssl base64 -A | tr '+/' '-_' | tr -d '=')
                  signature=$(printf '%s.%s' "$header" "$payload" \
                    | openssl dgst -sha256 -sign /app-key/private-key.pem \
                    | openssl base64 -A | tr '+/' '-_' | tr -d '=')

                  token=$(curl -fsS -X POST \
                    -H "Authorization: Bearer ${header}.${payload}.${signature}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
                    | jq -er .token)

                  printf '%s' "$token" > /run/renovate/token
                  chmod 0644 /run/renovate/token
                  test -s /run/renovate/token
              volumeMounts:
                - name: app-key
                  mountPath: /app-key
                  readOnly: true
                - name: token
                  mountPath: /run/renovate
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          containers:
            - name: renovate
              image: renovate/renovate:44.225.0
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
              args:
                - |
                  export RENOVATE_TOKEN="$(cat /run/renovate/token)"
                  exec renovate
              env:
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: kevinlacotaco/manifests
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: LOG_LEVEL
                  value: info
                - name: TZ
                  value: America/New_York
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: token
                  mountPath: /run/renovate
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: token
              emptyDir:
                sizeLimit: 1Mi
            - name: app-key
              secret:
                secretName: renovate-github-app
                items:
                  - key: private-key
                    path: private-key.pem
