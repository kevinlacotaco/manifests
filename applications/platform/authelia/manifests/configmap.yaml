apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    theme: dark

    server:
      address: tcp://0.0.0.0:9091
      endpoints:
        authz:
          forward-auth:
            implementation: ForwardAuth

    log:
      level: info

    totp:
      issuer: lakotko
      period: 30
      skew: 1

    authentication_backend:
      file:
        path: /config/users_database.yml

    access_control:
      default_policy: one_factor
      rules:
        - domain: meals.lakotko.synology.me
          policy: two_factor
        - domain: tasks.lakotko.synology.me
          policy: two_factor

    session:
      name: authelia_session
      expiration: 1h
      inactivity: 5m
      cookies:
        - domain: lakotko.synology.me
          authelia_url: https://auth.lakotko.synology.me

    storage:
      local:
        path: /config/db.sqlite3

    notifier:
      filesystem:
        filename: /config/notifications.txt
