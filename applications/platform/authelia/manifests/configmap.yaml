apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: "theme: dark\n\nserver:\n  address: tcp://0.0.0.0:9091\n  endpoints:\n\
    \    authz:\n      forward-auth:\n        implementation: ForwardAuth\n\nlog:\n\
    \  level: info\n\ntotp:\n  issuer: lakotko\n  period: 30\n  skew: 1\n\nauthentication_backend:\n\
    \  file:\n    path: /config/users_database.yml\n\naccess_control:\n  default_policy:\
    \ one_factor\n  rules:\n    - domain: meals.lakotko.synology.me\n      policy:\
    \ two_factor\n    - domain: tasks.lakotko.synology.me\n      policy: two_factor\n\
    \    - domain: paperless.lakotko.synology.me\n      policy: two_factor\n    -\
    \ domain: omni.lakotko.synology.me\n      policy: two_factor\n\nidentity_providers:\n\
    \  oidc:\n    hmac_secret: {{ secret \"/config/secrets/oidc/hmac-secret\" | msquote\
    \ }}\n    jwks:\n      - key: {{ secret \"/config/secrets/oidc/jwks-key\" | mindent\
    \ 10 \"|\" | msquote }}\n        algorithm: RS256\n        use: sig\n    clients:\n\
    \      - client_id: paperless-ngx\n        client_name: Paperless-ngx\n      \
    \  client_secret: '$pbkdf2-sha512$310000$hTto45JLdudQmHS6qGBw3g$Sj2xy17oaiVJ5RyFxoStK0Qsrrey4JT7I30v11VNC8MvFLA/Hl/RNkXqs9T034N3/qiTsDiXy8Zp4UBRPMQO9Q'\n\
    \        public: false\n        redirect_uris:\n          - https://paperless.lakotko.synology.me/accounts/oidc/authelia/login/callback/\n\
    \        scopes:\n          - openid\n          - profile\n          - email\n\
    \          - groups\n        authorization_policy: two_factor\n        token_endpoint_auth_method:\
    \ client_secret_basic\n        userinfo_signed_response_alg: none\n        consent_mode:\
    \ implicit\n\nsession:\n  name: authelia_session\n  expiration: 1h\n  inactivity:\
    \ 5m\n  cookies:\n    - domain: lakotko.synology.me\n      authelia_url: https://auth.lakotko.synology.me\n\
    \  redis:\n    host: authelia-redis\n    port: 6379\n\nstorage:\n  postgres:\n\
    \    address: tcp://postgres-headless-service.database.svc.cluster.local:5432\n\
    \    database: authelia\n    username: authelia\n    password: {{ secret \"/config/secrets/authelia-db/POSTGRES_PASSWORD\"\
    \ | msquote }}\n\nnotifier:\n  filesystem:\n    filename: /tmp/notifications.txt\n"
