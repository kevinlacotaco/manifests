apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
  labels:
    app: authelia
spec:
  type: ClusterIP
  selector:
    app: authelia
  ports:
  - name: http
    port: 9091
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9959
    targetPort: metrics
    protocol: TCP
