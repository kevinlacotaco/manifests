apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: auth
spec:
  ingressClassName: traefik
  rules:
  - host: auth.lakotko.synology.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authelia
            port:
              name: http
