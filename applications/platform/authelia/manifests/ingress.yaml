apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: auth
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Authelia"
    gethomepage.dev/group: "Edge"
    gethomepage.dev/icon: "authelia.png"
    gethomepage.dev/href: "https://auth.lakotko.synology.me"
spec:
  ingressClassName: traefik
  rules:
  - host: auth.lakotko.synology.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authelia
            port:
              name: http
