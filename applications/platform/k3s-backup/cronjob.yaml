apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-sqlite-backup
  namespace: k3s-backup
  labels:
    app.kubernetes.io/name: k3s-sqlite-backup
    app.kubernetes.io/part-of: k3s-backup
spec:
  schedule: "0 1 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k3s-sqlite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: boulder
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /scripts/backup.py
              env:
                - name: TZ
                  value: America/New_York
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: source
                  mountPath: /source
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: source
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
            - name: backup
              nfs:
                server: 192.168.68.138
                path: /volume1/k8s-nfs/k3s-backups
            - name: scripts
              configMap:
                name: k3s-sqlite-backup
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
