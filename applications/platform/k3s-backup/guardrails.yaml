apiVersion: v1
kind: ResourceQuota
metadata:
  name: k3s-backup
  namespace: k3s-backup
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: k3s-backup
  namespace: k3s-backup
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 512Mi
