apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto
  namespace: messaging
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.68.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: radio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frigate
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: govee2mqtt
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 1883
          protocol: TCP
