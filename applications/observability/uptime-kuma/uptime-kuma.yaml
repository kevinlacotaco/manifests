apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
spec:
  project: observability

  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      targetRevision: 3.7.3

      helm:
        valueFiles:
          - $values/applications/observability/uptime-kuma/values.yaml

    - repoURL: git@github.com:kevinlacotaco/manifests.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: ""
      kind: Service
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: apps
      kind: Deployment
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
