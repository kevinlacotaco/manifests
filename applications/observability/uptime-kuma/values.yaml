global:
  labels:
    argocd.argoproj.io/instance: uptime-kuma

controllers:
  main:
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: "0%"

    initContainers:
      seed-monitors:
        image:
          repository: louislam/uptime-kuma
          tag: 1.23.16
        env:
          - name: NTFY_TOKEN
            valueFrom:
              secretKeyRef:
                name: alertmanager-ntfy
                key: token
          - name: KOPIA_PUSH_TOKEN
            valueFrom:
              secretKeyRef:
                name: uptime-kuma-push
                key: token
        command:
          - /bin/sh
          - -ec
          - |
            : "${NTFY_TOKEN:?NTFY_TOKEN is required}"
            : "${KOPIA_PUSH_TOKEN:?KOPIA_PUSH_TOKEN is required}"
            sqlite3 /app/data/kuma.db <<SQL
            .timeout 30000
            .bail on
            BEGIN;
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Argo CD', 1, 1, 60, 'http', 2000, 2, 60, 'Argo CD API and UI', 'http://argo-argocd-server.argocd.svc.cluster.local/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Argo CD')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Grafana', 1, 1, 60, 'http', 2000, 2, 60, 'Grafana health endpoint', 'http://grafana.monitoring.svc.cluster.local/api/health', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Grafana')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Prometheus', 1, 1, 60, 'http', 2000, 2, 60, 'Prometheus health endpoint', 'http://prometheus-server.monitoring.svc.cluster.local/-/healthy', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Prometheus')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Alertmanager', 1, 1, 60, 'http', 2000, 2, 60, 'Alertmanager health endpoint', 'http://prometheus-alertmanager.monitoring.svc.cluster.local:9093/-/healthy', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Alertmanager')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Loki', 1, 1, 60, 'http', 2000, 2, 60, 'Loki readiness endpoint', 'http://loki.monitoring.svc.cluster.local:3100/ready', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Loki')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Uptime Kuma', 1, 1, 60, 'http', 2000, 2, 60, 'Uptime Kuma web UI', 'http://uptime-kuma.monitoring.svc.cluster.local:3001/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Uptime Kuma')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Mealie', 1, 1, 60, 'http', 2000, 2, 60, 'Mealie application', 'http://mealie.mealie.svc.cluster.local:9000/api/app/about', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Mealie')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Donetick', 1, 1, 60, 'http', 2000, 2, 60, 'Donetick application', 'http://donetick.donetick.svc.cluster.local:2021/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Donetick')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Paperless', 1, 1, 60, 'http', 2000, 2, 60, 'Paperless-ngx application', 'http://paperless-web.paperless.svc.cluster.local:8000/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Paperless')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'ntfy', 1, 1, 60, 'http', 2000, 2, 60, 'ntfy health endpoint', 'http://ntfy-ntfy.ntfy.svc.cluster.local/v1/health', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'ntfy')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'AdGuard Home', 1, 1, 60, 'http', 2000, 2, 60, 'AdGuard Home web UI', 'http://adguard-home.networking.svc.cluster.local:3001/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'AdGuard Home')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, hostname, port)
            SELECT 'AdGuard DNS', 1, 1, 60, 'port', 2000, 2, 60, 'AdGuard Home DNS TCP listener', '192.168.68.71', 53
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'AdGuard DNS')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, hostname, port)
            SELECT 'Kubernetes API', 1, 1, 60, 'port', 2000, 2, 60, 'Kubernetes API TCP listener', 'kubernetes.default.svc', 443
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Kubernetes API')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, hostname, port)
            SELECT 'PostgreSQL', 1, 1, 60, 'port', 2000, 2, 60, 'PostgreSQL TCP listener', 'postgres-headless-service.database.svc.cluster.local', 5432
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'PostgreSQL')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, hostname, port)
            SELECT 'RabbitMQ AMQP', 1, 1, 60, 'port', 2000, 2, 60, 'RabbitMQ AMQP TCP listener', 'rabbitmq.messaging.svc.cluster.local', 5672
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'RabbitMQ AMQP')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, hostname, port)
            SELECT 'Traefik', 1, 1, 60, 'port', 2000, 2, 60, 'Traefik TCP listener', 'traefik.kube-system.svc.cluster.local', 8080
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Traefik')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Kuma ingress', 1, 1, 60, 'http', 2000, 2, 60, 'Uptime Kuma through Traefik ingress', 'https://kuma.lakotko.synology.me/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Kuma ingress')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'ntfy ingress', 1, 1, 60, 'http', 2000, 2, 60, 'ntfy through Traefik ingress', 'https://ntfy.lakotko.synology.me/v1/health', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'ntfy ingress')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Authelia', 1, 1, 60, 'http', 2000, 2, 60, 'Authelia authentication portal', 'https://auth.lakotko.synology.me/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Authelia')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, url, method, maxredirects, accepted_statuscodes_json, ignore_tls, upside_down, expiry_notification)
            SELECT 'Speedtest Tracker', 1, 1, 60, 'http', 2000, 2, 60, 'Speedtest Tracker internal HTTP', 'http://speedtest-tracker.speedtest-tracker.svc.cluster.local/', 'GET', 10, '["200-299"]', 0, 0, 1
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Speedtest Tracker')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            INSERT INTO monitor (name, active, user_id, "interval", type, weight, maxretries, retry_interval, description, push_token)
            SELECT 'Kopia backups', 1, 1, 90000, 'push', 2000, 2, 60, 'Daily Kopia backup heartbeat', '${KOPIA_PUSH_TOKEN}'
            WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name = 'Kopia backups')
              AND EXISTS (SELECT 1 FROM user WHERE id = 1);
            UPDATE monitor SET push_token = '${KOPIA_PUSH_TOKEN}', "interval" = 90000 WHERE name = 'Kopia backups';
            DELETE FROM monitor_notification WHERE notification_id IN (SELECT id FROM notification WHERE name IN ('ntfy', 'platform', 'apps'));
            DELETE FROM notification WHERE name IN ('ntfy', 'platform', 'apps');
            INSERT INTO notification (name, active, user_id, is_default, config)
            SELECT 'platform', 1, 1, 1, '{"type":"ntfy","name":"platform","active":true,"isDefault":true,"ntfyAuthenticationMethod":"accessToken","ntfyserverurl":"http://ntfy-ntfy.ntfy.svc.cluster.local/","ntfytopic":"platform","ntfyPriority":4,"ntfyaccesstoken":"${NTFY_TOKEN}"}'
            WHERE NOT EXISTS (SELECT 1 FROM notification WHERE name = 'platform');
            INSERT INTO notification (name, active, user_id, is_default, config)
            SELECT 'apps', 1, 1, 1, '{"type":"ntfy","name":"apps","active":true,"isDefault":true,"ntfyAuthenticationMethod":"accessToken","ntfyserverurl":"http://ntfy-ntfy.ntfy.svc.cluster.local/","ntfytopic":"apps","ntfyPriority":4,"ntfyaccesstoken":"${NTFY_TOKEN}"}'
            WHERE NOT EXISTS (SELECT 1 FROM notification WHERE name = 'apps');
            INSERT INTO monitor_notification (monitor_id, notification_id)
            SELECT m.id, n.id FROM monitor m, notification n
            WHERE n.name = CASE WHEN m.name IN ('Argo CD','Grafana','Prometheus','Alertmanager','Loki','Uptime Kuma','AdGuard Home','AdGuard DNS','Kubernetes API','PostgreSQL','RabbitMQ AMQP','Traefik','Kuma ingress','Authelia','Kopia backups') THEN 'platform' ELSE 'apps' END
              AND NOT EXISTS (SELECT 1 FROM monitor_notification mn WHERE mn.monitor_id = m.id AND mn.notification_id = n.id);
            UPDATE monitor SET maxretries = 2, retry_interval = 60;
            COMMIT;
            SQL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi

    containers:
      app:
        image:
          repository: louislam/uptime-kuma
          tag: 1.23.16

        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - sleep 10

        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

        ports:
          - containerPort: 3001
            name: http
            protocol: TCP

service:
  main:
    controller: main

    ports:
      http:
        port: 3001

ingress:
  main:
    enabled: true
    className: traefik

    hosts:
      - host: kuma.lakotko.synology.me
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: synology-iscsi
    size: 5Gi

    globalMounts:
      - path: /app/data
