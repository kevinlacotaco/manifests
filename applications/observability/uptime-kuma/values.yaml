controllers:
  main:
    containers:
      app:
        image:
          repository: louislam/uptime-kuma
          tag: 1.23.16

        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

        ports:
          - containerPort: 3001
            name: http
            protocol: TCP

service:
  main:
    controller: main

    ports:
      http:
        port: 3001

ingress:
  main:
    enabled: true
    className: traefik

    hosts:
      - host: kuma.lakotko.synology.me
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: synology-iscsi
    size: 5Gi

    globalMounts:
      - path: /app/data
