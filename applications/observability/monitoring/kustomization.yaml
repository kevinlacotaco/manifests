apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep these labels on metadata only. Including them in selectors breaks
# NetworkPolicies that target pods created by child Applications, because
# those pods do not receive this kustomization's labels.
labels:
  - pairs:
      infrastructure.io/component: observability
    includeSelectors: false

resources:
  - grafana-admin-sealed-secret.yaml
  - alertmanager-ntfy-sealed-secret.yaml
  - alertmanager-ntfy-relay.yaml
  - guardrails.yaml
  - grafana.yaml
  - grafana-ingress.yaml
  - grafana-network-policy.yaml
  - grafana-dashboards.yaml
  - prometheus.yaml
  - loki.yaml
  - alloy.yaml
  - uptime-kuma-push-sealed-secret.yaml
  - uptime-kuma-sqlite-backup.yaml
  - grafana-sqlite-backup.yaml
