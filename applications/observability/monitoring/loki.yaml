apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.55.0
    chart: loki
    helm:
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            ingestion_rate_mb: 32
            ingestion_burst_size_mb: 64
            per_stream_rate_limit: 16MB
            per_stream_rate_limit_burst: 32MB
          storage:
            type: filesystem
          storage_config:
            filesystem:
              directory: /var/loki/chunks

          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

        # This is a single-node homelab. The chart's default memcached caches
        # request roughly 11Gi of memory while only using a few MiB. Loki works
        # without them and the filesystem/TSDB backend is the source of truth.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # There are no Loki rule ConfigMaps in the cluster. The rules sidecar
        # was OOMKilled at its 64Mi limit, which left the pod 1/2 and removed
        # Loki from the gateway endpoints, causing 502s for every log query.
        sidecar:
          rules:
            enabled: false

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          persistence:
            enabled: true
            size: 20Gi
            storageClass: synology-iscsi

        gateway:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # The chart default is hard node anti-affinity. With a single-node
          # cluster a rolling update can never schedule the surge pod, so
          # recreate the single gateway pod instead.
          affinity:
            podAntiAffinity: null
          deploymentStrategy:
            type: Recreate

        lokiCanary:
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              cpu: 50m
              memory: 64Mi

        read:
          replicas: 0

        write:
          replicas: 0

        backend:
          replicas: 0

        service:
          type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
