apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-sqlite-backup
  namespace: monitoring
spec:
  schedule: "30 1 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: uptime-kuma-sqlite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sqlite-backup
              image: louislam/uptime-kuma:1.23.16
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  mkdir -p /backup-share/staging/sqlite
                  out=/backup-share/staging/sqlite/uptime-kuma.db
                  rm -f "$out"
                  # SQLite's online backup API produces a consistent copy while
                  # Uptime Kuma is running. The PVC is writable so SQLite can
                  # use the live WAL/SHM files if present.
                  sqlite3 /data/kuma.db ".timeout 30000" ".backup '$out'"
                  check=$(sqlite3 "$out" "PRAGMA integrity_check;")
                  [ "$check" = "ok" ] || {
                    echo "integrity check failed: $check" >&2
                    exit 1
                  }
                  ls -lh "$out"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup-share
                  mountPath: /backup-share
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: uptime-kuma-config
            - name: backup-share
              nfs:
                server: 192.168.68.138
                path: /volume1/k8s-backups
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
