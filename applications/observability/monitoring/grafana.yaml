apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.3.7
    chart: grafana
    helm:
      values: |
        # Grafana keeps its state in PostgreSQL. The PVC below is retained for
        # rollback to the original SQLite database and still backs the plugins
        # directory; deploymentStrategy Recreate keeps a single writer during
        # upgrades.
        deploymentStrategy:
          type: Recreate

        # Database settings live in grafana.ini; the password is injected as
        # GF_DATABASE_PASSWORD from a SealedSecret so it never enters values.
        grafana.ini:
          database:
            type: postgres
            host: postgres-headless-service.database.svc.cluster.local:5432
            name: grafana
            user: grafana
            ssl_mode: disable

        envValueFrom:
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: grafana-db-secret
              key: password

        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        service:
          type: ClusterIP
        persistence:
          enabled: true
          type: pvc
          storageClassName: synology-iscsi
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472
        initChownData:
          enabled: false
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboardsConfigMaps:
          default: grafana-dashboards
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: true
                jsonData:
                  timeInterval: 30s
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki-gateway.monitoring.svc.cluster.local
                jsonData:
                  maxLines: 1000
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
