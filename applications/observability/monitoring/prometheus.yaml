apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 25.21.0
    chart: prometheus
    helm:
      values: |
        alertmanager:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          config:
            enabled: true
            global:
              resolve_timeout: 5m
            route:
              receiver: ntfy-warning
              group_by:
                - alertname
                - namespace
                - severity
              group_wait: 10s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - matchers:
                    - alertname="CrowdSecThreatDetected"
                  receiver: ntfy-crowdsec
                  group_wait: 30s
                  group_interval: 10m
                  repeat_interval: 6h
                - matchers:
                    - severity="critical"
                  receiver: ntfy-critical
                  repeat_interval: 1h
                - matchers:
                    - severity="info"
                  receiver: ntfy-info
                  repeat_interval: 12h
            inhibit_rules:
              - source_matchers:
                  - alertname="PodCrashLooping"
                target_matchers:
                  - alertname="PodNotReady"
                equal:
                  - namespace
                  - pod
              - source_matchers:
                  - alertname="RabbitMQDown"
                target_matchers:
                  - component="rabbitmq"
                equal:
                  - instance
            receivers:
              - name: ntfy-critical
                webhook_configs:
                  - url: http://alertmanager-ntfy-relay.monitoring.svc.cluster.local:8080/webhook
                    send_resolved: true
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/token
              - name: ntfy-warning
                webhook_configs:
                  - url: http://alertmanager-ntfy-relay.monitoring.svc.cluster.local:8080/webhook
                    send_resolved: true
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/token
              - name: ntfy-crowdsec
                webhook_configs:
                  - url: http://alertmanager-ntfy-relay.monitoring.svc.cluster.local:8080/webhook
                    send_resolved: false
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/token
              - name: ntfy-info
                webhook_configs:
                  - url: http://alertmanager-ntfy-relay.monitoring.svc.cluster.local:8080/webhook
                    send_resolved: true
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/token
            templates:
              - /etc/alertmanager/*.tmpl
          extraSecretMounts:
            - name: ntfy-token
              mountPath: /etc/alertmanager/secrets
              subPath: ""
              secretName: alertmanager-ntfy
              readOnly: true

        configmapReload:
          prometheus:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi

        server:
          extraSecretMounts:
            - name: uptime-kuma-metrics
              mountPath: /etc/prometheus/secrets
              subPath: ""
              secretName: uptime-kuma-metrics
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          service:
            type: ClusterIP

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheus-node-exporter:
          # Node-exporter is the one monitoring pod allowed on grapple: it is
          # small and gives the Pi a basic node view. Alloy stays off.
          tolerations:
            - key: homelab.io/radios
              operator: Equal
              value: "true"
              effect: NoSchedule
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi

        prometheus-pushgateway:
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi

        serverFiles:
          alerting_rules.yml:
            groups:
              - name: homelab-node
                rules:
                  - alert: NodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      component: node
                    annotations:
                      summary: Node {{ $labels.node }} is NotReady
                      description: The node has reported NotReady for more than 5 minutes.

                  - alert: NodeMemoryHigh
                    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
                    for: 10m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Node {{ $labels.instance }} memory is above 85%
                      description: Memory usage has been above 85% for 10 minutes.

                  - alert: NodeCPUHigh
                    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
                    for: 15m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Node {{ $labels.instance }} CPU is above 90%
                      description: CPU usage has been above 90% for 15 minutes.

                  - alert: NodeLoadHigh
                    expr: node_load1 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2
                    for: 15m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Node {{ $labels.instance }} load is high
                      description: One-minute load average is more than twice the CPU count.

                  - alert: NodeFilesystemFillingUp
                    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100 < 15
                    for: 15m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free
                      description: The filesystem has less than 15% free space.

                  - alert: NodeFilesystemReadOnly
                    # NFS volumes mounted read-only into pods (Jellyfin media,
                    # backup jobs) are intentional. Each pod gets a new kubelet
                    # mount path, so alerting on them only produces noise.
                    expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs|iso9660",mountpoint!~"/var/lib/kubelet/pods/.+/volumes/kubernetes.io~nfs/.+"} == 1
                    for: 5m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is read-only
                      description: A writable filesystem has been mounted read-only for 5 minutes.

                  - alert: NodeClockSkew
                    expr: abs(node_time_seconds - time()) > 300
                    for: 10m
                    labels:
                      severity: warning
                      component: node
                    annotations:
                      summary: Node {{ $labels.instance }} clock is skewed
                      description: Node time differs from Prometheus by more than 5 minutes.

              - name: homelab-workloads
                rules:
                  - alert: PodCrashLooping
                    expr: increase(kube_pod_container_status_restarts_total[15m]) > 3 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
                    for: 5m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting
                      description: Container {{ $labels.container }} restarted more than 3 times in 15 minutes.

                  - alert: PodNotReady
                    expr: kube_pod_status_ready{condition="false"} == 1 and on(namespace, pod) kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
                      description: The pod has been not ready for 10 minutes.

                  - alert: PodPending
                    expr: kube_pod_status_phase{phase="Pending"} == 1
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is pending
                      description: The pod has been pending for 10 minutes.

                  - alert: ContainerWaiting
                    expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"} > 0
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is waiting
                      description: Container is waiting with reason {{ $labels.reason }}.

                  - alert: KubeContainerOOMKilled
                    expr: (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1) and (increase(kube_pod_container_status_restarts_total[15m]) > 0)
                    for: 1m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled
                      description: Container was OOMKilled and has restarted recently.

                  - alert: DeploymentUnavailable
                    expr: kube_deployment_status_replicas_unavailable > 0
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas
                      description: One or more replicas have been unavailable for 10 minutes.

                  - alert: DaemonSetUnavailable
                    expr: kube_daemonset_status_number_unavailable > 0
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable pods
                      description: One or more daemonset pods have been unavailable for 10 minutes.

                  - alert: JobFailed
                    expr: kube_job_status_failed > 0
                    for: 10m
                    labels:
                      severity: warning
                      component: workload
                    annotations:
                      summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
                      description: The job has failed.

              - name: homelab-storage
                rules:
                  - alert: PersistentVolumeFillingUp
                    expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 15
                    for: 15m
                    labels:
                      severity: warning
                      component: storage
                    annotations:
                      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is below 15% free
                      description: The persistent volume claim has less than 15% free space.

                  - alert: PersistentVolumeFillingUpCritical
                    expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 5
                    for: 5m
                    labels:
                      severity: critical
                      component: storage
                    annotations:
                      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is below 5% free
                      description: The persistent volume claim has less than 5% free space.

                  - alert: PersistentVolumeClaimPending
                    expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
                    for: 15m
                    labels:
                      severity: warning
                      component: storage
                    annotations:
                      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending
                      description: The persistent volume claim has been pending for 15 minutes.

              - name: homelab-synology
                rules:
                  - alert: SynologyDiskUnhealthy
                    expr: synology_disk_status != 1
                    for: 5m
                    labels:
                      severity: critical
                      component: storage
                    annotations:
                      summary: Synology disk {{ $labels.diskIndex }} is unhealthy
                      description: SMART/disk status reports a non-normal state.
                  - alert: SynologyDiskTemperatureHigh
                    expr: synology_disk_temperature_celsius > 55
                    for: 10m
                    labels:
                      severity: warning
                      component: storage
                    annotations:
                      summary: Synology disk {{ $labels.diskIndex }} is hot
                      description: Disk temperature is above 55 C.
                  - alert: SynologyVolumeUnhealthy
                    expr: synology_raid_status != 1
                    for: 5m
                    labels:
                      severity: critical
                      component: storage
                    annotations:
                      summary: Synology RAID/volume status abnormal
                      description: Storage pool or volume status is not normal.
                  - alert: SynologySystemUnhealthy
                    expr: synology_system_status != 1
                    for: 5m
                    labels:
                      severity: critical
                      component: storage
                    annotations:
                      summary: Synology system status abnormal
                      description: NAS system status is not normal.
                  - alert: SynologyPowerOrThermalUnhealthy
                    expr: (synology_power_status != 1) or (synology_thermal_status != 1)
                    for: 5m
                    labels:
                      severity: critical
                      component: storage
                    annotations:
                      summary: Synology power or thermal status abnormal
                      description: NAS power or thermal status is not normal.
                  - alert: SynologyRebooted
                    expr: synology_sys_uptime < 60000
                    for: 5m
                    labels:
                      severity: warning
                      component: storage
                    annotations:
                      summary: Synology NAS rebooted
                      description: SNMP sysUpTime is below 10 minutes.
              - name: homelab-argocd
                rules:
                  - alert: ArgoAppOutOfSync
                    expr: argocd_app_info{sync_status!="Synced"} == 1
                    for: 15m
                    labels:
                      severity: warning
                      component: argocd
                    annotations:
                      summary: Argo CD app {{ $labels.name }} is {{ $labels.sync_status }}
                      description: The application has been out of sync for 15 minutes.

                  - alert: ArgoAppDegraded
                    expr: argocd_app_info{health_status!="Healthy"} == 1
                    for: 15m
                    labels:
                      severity: warning
                      component: argocd
                    annotations:
                      summary: Argo CD app {{ $labels.name }} is {{ $labels.health_status }}
                      description: The application has been unhealthy for 15 minutes.

                  - alert: ArgoAppSyncFailed
                    expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m]) > 0
                    for: 5m
                    labels:
                      severity: warning
                      component: argocd
                    annotations:
                      summary: Argo CD sync failed for {{ $labels.name }}
                      description: A sync operation failed in the last 15 minutes.

                  - alert: ArgoGitFetchFailures
                    expr: increase(argocd_git_fetch_fail_total[15m]) > 0
                    for: 5m
                    labels:
                      severity: warning
                      component: argocd
                    annotations:
                      summary: Argo CD Git fetch failures
                      description: Argo CD failed to fetch a Git repository in the last 15 minutes.

                  - alert: ArgoClusterConnectionFailed
                    expr: argocd_cluster_connection_status == 0
                    for: 10m
                    labels:
                      severity: critical
                      component: argocd
                    annotations:
                      summary: Argo CD cannot reach cluster {{ $labels.name }}
                      description: The cluster connection has been failing for 10 minutes.

              - name: homelab-monitoring
                rules:
                  - alert: PrometheusTargetDown
                    expr: up == 0
                    for: 5m
                    labels:
                      severity: warning
                      component: monitoring
                    annotations:
                      summary: Prometheus target {{ $labels.job }} is down
                      description: Target {{ $labels.instance }} has been down for 5 minutes.

                  - alert: AlertmanagerDown
                    expr: up{job=~".*alertmanager.*"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      component: monitoring
                    annotations:
                      summary: Alertmanager is down
                      description: Prometheus cannot scrape Alertmanager.

                  - alert: PrometheusRuleEvaluationFailures
                    expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
                    for: 5m
                    labels:
                      severity: warning
                      component: monitoring
                    annotations:
                      summary: Prometheus rule evaluation failures
                      description: One or more Prometheus rules failed to evaluate in the last 15 minutes.

                  - alert: PrometheusTSDBHighSeries
                    expr: prometheus_tsdb_head_series > 200000
                    for: 30m
                    labels:
                      severity: warning
                      component: monitoring
                    annotations:
                      summary: Prometheus TSDB has more than 200k series
                      description: Series cardinality has exceeded 200k for 30 minutes.

              - name: homelab-rabbitmq
                rules:
                  - alert: RabbitMQDown
                    expr: up{job="rabbitmq"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ is down
                      description: Prometheus cannot scrape RabbitMQ for 5 minutes.

                  - alert: RabbitMQMemoryHigh
                    expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.85
                    for: 10m
                    labels:
                      severity: warning
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ memory is above 85% of its limit
                      description: RabbitMQ is close to its memory high watermark.

                  - alert: RabbitMQDiskLow
                    expr: rabbitmq_disk_space_available_bytes < 1.5 * rabbitmq_disk_space_available_limit_bytes
                    for: 10m
                    labels:
                      severity: warning
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ disk space is low
                      description: Available disk space is less than 1.5 times the configured free-space limit.

                  - alert: RabbitMQQueueBacklog
                    expr: rabbitmq_queue_messages_ready > 1000
                    for: 15m
                    labels:
                      severity: warning
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ queue {{ $labels.queue }} has a backlog
                      description: More than 1000 messages have been ready for 15 minutes.

                  - alert: RabbitMQFileDescriptorsHigh
                    expr: rabbitmq_process_open_fds / rabbitmq_process_max_fds > 0.8
                    for: 10m
                    labels:
                      severity: warning
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ file descriptor usage is high
                      description: RabbitMQ is using more than 80% of its file descriptor limit.

                  - alert: RabbitMQAlarm
                    expr: rabbitmq_alarms_memory_used_watermark == 1 or rabbitmq_alarms_free_disk_space_watermark == 1
                    for: 5m
                    labels:
                      severity: critical
                      component: rabbitmq
                    annotations:
                      summary: RabbitMQ has an active resource alarm
                      description: RabbitMQ is blocking publishers due to memory or disk pressure.

              - name: homelab-apps
                rules:
                  - alert: AppMonitorDown
                    expr: monitor_status == 0
                    for: 5m
                    labels:
                      severity: warning
                      component: app
                    annotations:
                      summary: Application monitor {{ $labels.monitor_name }} is down
                      description: Uptime Kuma has reported {{ $labels.monitor_name }} down for 5 minutes.

              - name: homelab-ha
                rules:
                  - alert: K3sSQLiteBackupJobFailed
                    expr: kube_job_status_failed{namespace="k3s-backup",job_name=~"k3s-sqlite-backup-.*"} > 0
                    for: 5m
                    labels:
                      severity: warning
                      component: backup
                    annotations:
                      summary: k3s SQLite backup job failed
                      description: A k3s SQLite backup job has failed.

                  - alert: K3sSQLiteBackupStale
                    expr: |
                      kube_cronjob_status_last_successful_time{namespace="k3s-backup",cronjob="k3s-sqlite-backup"} > 0
                      and (time() - kube_cronjob_status_last_successful_time{namespace="k3s-backup",cronjob="k3s-sqlite-backup"}) > 93600
                    for: 15m
                    labels:
                      severity: warning
                      component: backup
                    annotations:
                      summary: k3s SQLite backup is stale
                      description: No successful k3s SQLite backup has completed in over 26 hours.

                  - alert: K3sSQLiteBackupMissing
                    expr: absent(kube_cronjob_status_last_successful_time{namespace="k3s-backup",cronjob="k3s-sqlite-backup"})
                    for: 30m
                    labels:
                      severity: warning
                      component: backup
                    annotations:
                      summary: k3s SQLite backup metric is missing
                      description: The k3s SQLite backup CronJob or its success metric has been absent for 30 minutes.

                  - alert: TraefikReplicasDegraded
                    expr: kube_deployment_status_replicas_available{namespace="kube-system",deployment="traefik"} < 2
                    for: 5m
                    labels:
                      severity: warning
                      component: ingress
                    annotations:
                      summary: Traefik has fewer than two ready replicas
                      description: Traefik has {{ $value }} available replicas; expected 2.

                  - alert: CoreDNSReplicasDegraded
                    expr: kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"} < 2
                    for: 5m
                    labels:
                      severity: warning
                      component: dns
                    annotations:
                      summary: CoreDNS has fewer than two ready replicas
                      description: CoreDNS has {{ $value }} available replicas; expected 2.

                  - alert: CertManagerReplicasDegraded
                    expr: kube_deployment_status_replicas_available{namespace="cert-manager",deployment=~"cert-manager|cert-manager-webhook|cert-manager-cainjector"} < 2
                    for: 5m
                    labels:
                      severity: warning
                      component: cert-manager
                    annotations:
                      summary: cert-manager component has fewer than two ready replicas
                      description: "{{ $labels.deployment }} has {{ $value }} available replicas; expected 2."

                  - alert: AutheliaReplicasDegraded
                    expr: kube_deployment_status_replicas_available{namespace="auth",deployment="authelia"} < 2
                    for: 5m
                    labels:
                      severity: warning
                      component: auth
                    annotations:
                      summary: Authelia has fewer than two ready replicas
                      description: Authelia has {{ $value }} available replicas; expected 2.

                  - alert: PodDisruptionBudgetBlocked
                    expr: kube_poddisruptionbudget_status_disruptions_allowed == 0 and on(namespace, poddisruptionbudget) kube_poddisruptionbudget_status_expected_pods > 0
                    for: 15m
                    labels:
                      severity: warning
                      component: availability
                    annotations:
                      summary: PodDisruptionBudget is blocking disruptions
                      description: "{{ $labels.namespace }}/{{ $labels.poddisruptionbudget }} has allowed zero disruptions for 15 minutes."

              - name: homelab-crowdsec
                rules:
                  - alert: CrowdSecThreatDetected
                    expr: |
                      sum(delta(cs_alerts[10m])) > 0
                      or sum(increase(cs_appsec_block_total[10m])) > 0
                      or sum(increase(cs_lapi_decisions_ok_total[10m])) > 0
                    for: 1m
                    labels:
                      severity: info
                      component: crowdsec
                    annotations:
                      summary: CrowdSec detected or blocked threat activity
                      description: New CrowdSec alerts, AppSec blocks, or active decisions in the last 10 minutes.

        extraScrapeConfigs: |
          - job_name: drm-exporter
            static_configs:
              - targets: ["drm-exporter.monitoring.svc.cluster.local:8081"]

          - job_name: grafana
            static_configs:
              - targets: ["grafana.monitoring.svc.cluster.local:80"]

          - job_name: loki
            static_configs:
              - targets: ["loki.monitoring.svc.cluster.local:3100"]

          - job_name: alloy
            static_configs:
              - targets: ["alloy.monitoring.svc.cluster.local:12345"]

          - job_name: argocd-application-controller
            static_configs:
              - targets: ["argo-argocd-application-controller-metrics.argocd.svc.cluster.local:8082"]

          - job_name: argocd-server
            static_configs:
              - targets: ["argo-argocd-server-metrics.argocd.svc.cluster.local:8083"]

          - job_name: argocd-repo-server
            static_configs:
              - targets: ["argo-argocd-repo-server-metrics.argocd.svc.cluster.local:8084"]

          - job_name: argocd-applicationset-controller
            static_configs:
              - targets: ["argo-argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080"]

          - job_name: rabbitmq
            metrics_path: /metrics/per-object
            static_configs:
              - targets: ["rabbitmq.messaging.svc.cluster.local:15692"]

          - job_name: synology-snmp
            metrics_path: /snmp
            scrape_interval: 60s
            scrape_timeout: 15s
            static_configs:
              - targets: ["192.168.68.138"]
            params:
              auth: [synology_v3]
              module: [synology]
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: prometheus-snmp-exporter.monitoring.svc.cluster.local:9116

          - job_name: node-exporter-adguard
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets: ["192.168.68.72:9100"]

          - job_name: postgres
            static_configs:
              - targets: ["prometheus-postgres-exporter.monitoring.svc.cluster.local:80"]

          - job_name: uptime-kuma
            metrics_path: /metrics
            basic_auth:
              username: prometheus
              password_file: /etc/prometheus/secrets/uptime-kuma-metrics
            static_configs:
              - targets: ["uptime-kuma.monitoring.svc.cluster.local:3001"]

          - job_name: home-assistant
            metrics_path: /api/prometheus
            scrape_interval: 60s
            static_configs:
              - targets: ["home-assistant.home-assistant.svc.cluster.local:8123"]

          - job_name: adguard
            scrape_interval: 30s
            static_configs:
              - targets: ["adguard-exporter.monitoring.svc.cluster.local:9311"]

          - job_name: alertmanager
            static_configs:
              - targets: ["prometheus-alertmanager.monitoring.svc.cluster.local:9093"]

          - job_name: sealed-secrets
            static_configs:
              - targets: ["sealed-secrets-metrics.kube-system.svc.cluster.local:8081"]

          - job_name: kyverno
            static_configs:
              - targets: ["kyverno-svc-metrics.kyverno.svc.cluster.local:8000"]
                labels:
                  controller: admission
              - targets: ["kyverno-background-controller-metrics.kyverno.svc.cluster.local:8000"]
                labels:
                  controller: background
              - targets: ["kyverno-cleanup-controller-metrics.kyverno.svc.cluster.local:8000"]
                labels:
                  controller: cleanup
              - targets: ["kyverno-reports-controller-metrics.kyverno.svc.cluster.local:8000"]
                labels:
                  controller: reports

          - job_name: loki-canary
            static_configs:
