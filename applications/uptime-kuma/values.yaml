controllers:
  main:
    containers:
      main:
        image:
          repository: louislam/uptime-kuma
          tag: 1.23.16

        ports:
          - containerPort: 3001
            name: http

service:
  main:
    ports:
      http:
        port: 3002

ingress:
  main:
    enabled: true
    className: traefik
    hosts:
      - host: kuma.local
        paths:
          - path: /
            pathType: Prefix

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: synology-iscsi
    size: 5Gi