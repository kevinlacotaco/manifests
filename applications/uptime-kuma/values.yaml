controllers:
  main:
    containers:
      app:
        image:
          repository: louislam/uptime-kuma
          tag: 1.23.16

        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

        ports:
          - containerPort: 3001
            name: http
            protocol: TCP

service:
  main:
    controller: main
    type: NodePort

    ports:
      http:
        port: 3001
        nodePort: 3002

ingress:
  main:
    enabled: true
    className: traefik

    hosts:
      - host: boulder.local
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: synology-iscsi
    size: 5Gi

    globalMounts:
      - path: /app/data
