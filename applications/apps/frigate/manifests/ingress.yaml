apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  namespace: frigate
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Frigate"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "frigate.png"
    gethomepage.dev/href: "https://frigate.lakotko.synology.me"
spec:
  ingressClassName: traefik
  rules:
    - host: frigate.lakotko.synology.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  name: http
