apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-restore
  namespace: frigate
data:
  restore.py: |
    import os
    import pathlib
    import tarfile

    config = pathlib.Path("/config")
    marker = config / ".restored-from-nas"
    if marker.exists():
        print("config already restored")
        raise SystemExit(0)

    print("extracting /backup/migration/frigate-config.tgz")
    with tarfile.open("/backup/migration/frigate-config.tgz", "r:gz") as archive:
        archive.extractall(config)

    config_yaml = config / "config.yaml"
    text = config_yaml.read_text()
    text = text.replace("host: mosquitto", "host: rabbitmq.messaging.svc.cluster.local")
    text = text.replace("192.168.68.138:8555", "192.168.68.71:8555")
    config_yaml.write_text(text)

    for path in [config, *config.rglob("*")]:
        try:
            os.chown(path, 1000, 1000, follow_symlinks=False)
        except OSError:
            pass

    marker.write_text("restored\n")
    print("restore complete")
