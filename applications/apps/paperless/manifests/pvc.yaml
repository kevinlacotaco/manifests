apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: synology-nfs-subdir
  resources:
    requests:
      storage: 50Gi
---
