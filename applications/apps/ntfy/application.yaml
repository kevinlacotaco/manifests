apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
spec:
  project: apps

  sources:
    - repoURL: https://repo.helmforge.dev
      chart: ntfy
      targetRevision: 1.8.0

      helm:
        valueFiles:
          - $values/applications/apps/ntfy/values.yaml

    - repoURL: git@github.com:kevinlacotaco/manifests.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ntfy

  # These resources were originally tracked by annotation. The label above
  # moves them to label tracking; ignore the stale annotation until Argo CD
  # has removed it during a sync.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: ""
      kind: Service
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: apps
      kind: Deployment
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
