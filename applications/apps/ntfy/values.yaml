image:
  tag: v2.32.0

ntfy:
  baseUrl: https://ntfy.example.com
  behindProxy: true
  authDefaultAccess: deny-all

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: ntfy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ntfy-tls
      hosts:
        - ntfy.example.com

persistence:
  enabled: true
  # ntfy stores SQLite files, so keep it on iSCSI rather than NFS. The old
  # chart-managed NFS PVC (ntfy-ntfy-data) was empty and is pruned on sync.
  existingClaim: ntfy-data-iscsi
  storageClass: synology-iscsi
  accessModes:
    - ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
