apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ntfy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-ingress
  namespace: ntfy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik and other platform ingress controllers.
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kube-system
                  - monitoring
        # Pods in this namespace.
        - podSelector: {}
        # Speedtest Tracker webhooks publish to ntfy.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: speedtest-tracker
          podSelector: {}
        # Kubelet health probes originate from the node.
        - ipBlock:
            cidr: 192.168.68.71/32
