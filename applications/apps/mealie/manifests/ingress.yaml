apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-authelia-forwardauth@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Mealie"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/icon: "mealie.png"
    gethomepage.dev/href: "https://meals.lakotko.synology.me"
spec:
  ingressClassName: traefik
  rules:
    - host: meals.lakotko.synology.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
