apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1

  # Keep the old pod serving while the new pod becomes ready. The media volume
  # is RWX, so both pods can mount it during a rollout.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: mealie

  template:
    metadata:
      labels:
        app: mealie
        requires-db: postgres

    spec:
      # The NFS export must allow UID/GID 911. NFS ignores fsGroup, but it is
      # kept here for the old iSCSI volume and for local-path fallbacks.
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.30.0

          ports:
            - containerPort: 9000

          env:
            - name: DB_ENGINE
              value: postgres

            - name: POSTGRES_SERVER
              value: postgres-headless-service.database.svc.cluster.local

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: mealie

            - name: POSTGRES_USER
              value: mealie

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db
                  key: POSTGRES_PASSWORD

            - name: BASE_URL
              value: https://meals.lakotko.synology.me

            # Authelia forward-auth sets Remote-User after the user passes
            # authentication. Mealie is only reachable from Traefik (see the
            # NetworkPolicy), so trusting that header avoids a second login.
            - name: REVERSE_PROXY_AUTH_ENABLED
              value: "true"

            - name: REVERSE_PROXY_AUTH_HEADER
              value: Remote-User

            - name: REVERSE_PROXY_AUTH_SIGNUP_ENABLED
              value: "true"

          volumeMounts:
            - name: data
              mountPath: /app/data

          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 15

          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-media
