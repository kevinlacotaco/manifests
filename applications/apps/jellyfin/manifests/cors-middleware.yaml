apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-cors
  namespace: jellyfin
spec:
  headers:
    accessControlAllowOriginList:
      - https://ha.lakotko.synology.me
      - http://192.168.68.102:8123
      - http://192.168.68.71:8123
    accessControlAllowMethods:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - Range
      - X-Emby-Token
      - X-Emby-Authorization
    accessControlExposeHeaders:
      - Content-Length
      - Content-Range
      - Accept-Ranges
    accessControlAllowCredentials: true
    accessControlMaxAge: 86400
    addVaryHeader: true
    customResponseHeaders:
      Access-Control-Allow-Private-Network: "true"
