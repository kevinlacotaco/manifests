apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: ci-runner
    app.kubernetes.io/part-of: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/component: ci-runner
        app.kubernetes.io/part-of: forgejo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: runner-register
          image: code.forgejo.org/forgejo/runner:13.2.1
          imagePullPolicy: IfNotPresent
          workingDir: /data
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eu
              if [ -f /data/config.yml ]; then
                echo "runner config already exists"
                exit 0
              fi
              attempt=1
              while [ "$attempt" -le 60 ]; do
                if forgejo-runner register --no-interactive \
                  --token "$RUNNER_SECRET" \
                  --name "$RUNNER_NAME" \
                  --instance "$FORGEJO_INSTANCE_URL"; then
                  break
                fi
                echo "registration attempt $attempt failed; retrying"
                attempt=$((attempt + 1))
                sleep 2
              done
              if [ "$attempt" -gt 60 ]; then
                echo "runner registration failed" >&2
                exit 1
              fi
              forgejo-runner generate-config > /data/config.yml
              sed -i -e "s|network: .*|network: host|" /data/config.yml
              sed -i -e "s|^  envs:$|  envs:\n    DOCKER_HOST: tcp://localhost:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|" /data/config.yml
              sed -i -e "s|^  options:|  options: -v /certs/client:/certs/client|" /data/config.yml
              sed -i -e "s|  valid_volumes: \\[\\]$|  valid_volumes:\n    - /certs/client|" /data/config.yml
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-token
                  key: token
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.1
          imagePullPolicy: IfNotPresent
          workingDir: /data
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eu
              while ! nc -z 127.0.0.1 2376 </dev/null; do
                echo "waiting for docker daemon"
                sleep 2
              done
              exec forgejo-runner --config /data/config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
        - name: dind
          image: docker.io/library/docker:28.3.0-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: docker-certs
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
