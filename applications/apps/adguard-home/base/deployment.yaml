apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: networking
spec:
  replicas: 1
  # Keep the old pod serving while the new pod becomes ready. The RWO volume
  # can be mounted by both pods on the same node; on multi-node, maxUnavailable
  # 0 makes the rollout wait rather than dropping DNS.
  minReadySeconds: 10
  # AdGuard Home keeps its session database on a single-writer SQLite
  # volume. Recreate makes the old pod release the database before the new
  # pod starts; RollingUpdate leaves both pods running and the new pod
  # times out opening sessions.db.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: fix-permissions
          image: alpine:3.24
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          command:
            - /bin/sh
            - -ec
            - |
              chown -R 1000:1000 /work
              chmod 0700 /work
          volumeMounts:
            - name: data
              mountPath: /work
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: render-config
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eux

              echo "===== INIT: START CONFIG RENDER ====="

              echo "--- base.yaml ---"
              cat /base/base.yaml || echo "missing base.yaml"

              echo "--- users.yaml (redacted preview) ---"
              sed 's/password:.*/password: [REDACTED]/' /secret/users.yaml || echo "missing users.yaml"

              echo "--- file merge step ---"
              mkdir -p /config

              cat /base/base.yaml > /config/AdGuardHome.yaml
              echo "" >> /config/AdGuardHome.yaml
              cat /secret/users.yaml >> /config/AdGuardHome.yaml

              echo "--- final merged config (sanitized) ---"
              sed 's/password:.*/password: [REDACTED]/' /config/AdGuardHome.yaml

              echo "===== INIT: DONE ====="
          volumeMounts:
            - name: base-config
              mountPath: /base
            - name: secret-config
              mountPath: /secret
            - name: config
              mountPath: /config

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.80
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 3000
              name: web

          startupProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf

            - name: data
              mountPath: /opt/adguardhome/work

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: base-config
          configMap:
            name: adguard-base-config

        - name: secret-config
          secret:
            secretName: adguard-secret

        - name: config
          emptyDir: {}

        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-pvc
