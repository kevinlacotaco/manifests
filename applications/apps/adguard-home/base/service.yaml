apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  namespace: networking
spec:
  type: LoadBalancer
  # Keep the real LAN client IP visible in AdGuard query logs instead of the
  # node's SNAT address. The pod is pinned to boulder, so only boulder serves
  # the LoadBalancer VIP; other nodes' IPs (.102) no longer answer DNS for it.
  externalTrafficPolicy: Local
  selector:
    app: adguard-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
      nodePort: 30915

    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
      nodePort: 30916

    - name: web
      port: 3001
      targetPort: 3000
      nodePort: 31628
