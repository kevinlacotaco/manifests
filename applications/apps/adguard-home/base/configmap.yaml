apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-base-config
  namespace: networking
data:
  base.yaml: |
    schema_version: 34
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - https://dns.quad9.net/dns-query
        - https://cloudflare-dns.com/dns-query
      upstream_mode: load_balance
      enable_dnssec: true

    filters:
      - id: 1
        enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
      - id: 2
        enabled: true
        url: https://big.oisd.nl/
        name: OISD Full
      - id: 3
        enabled: true
        url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt
        name: HaGeZi Pro

    filtering:
      protection_enabled: true
      rewrites:
        - domain: boulder.home.arpa
          answer: 192.168.68.71
          enabled: true
        - domain: hauler.home.arpa
          answer: 192.168.68.102
          enabled: true
        - domain: grapple.home.arpa
          answer: 192.168.68.53
          enabled: true
        - domain: nas.home.arpa
          answer: 192.168.68.138
          enabled: true
        - domain: adguard-primary.home.arpa
          answer: 192.168.68.72
          enabled: true
        - domain: pebble.home.arpa
          answer: 192.168.68.72
          enabled: true
        - domain: router.home.arpa
          answer: 192.168.68.1
          enabled: true
        - domain: youtarr.lakotko.synology.me
          answer: 192.168.68.71
          enabled: true
        - domain: jellyfin.lakotko.synology.me
          answer: 192.168.68.71
          enabled: true
        - domain: argocd.home.arpa
          answer: 192.168.68.71
          enabled: true
        - domain: argocd.lakotko.synology.me
          answer: 192.168.68.71
          enabled: true

    http:
      address: 0.0.0.0:3000
