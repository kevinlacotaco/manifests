apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
  namespace: changedetection
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: synology-iscsi

  resources:
    requests:
      storage: 10Gi
