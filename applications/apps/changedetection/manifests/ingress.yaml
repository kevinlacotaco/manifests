apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection
  namespace: changedetection
  annotations:
    # LAN-only: no DSM reverse proxy and no external auth middleware.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "changedetection.io"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/icon: "changedetection.png"
    gethomepage.dev/href: "https://changedetection.lakotko.synology.me"
spec:
  ingressClassName: traefik
  rules:
    - host: changedetection.lakotko.synology.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: changedetection
                port:
                  name: http
