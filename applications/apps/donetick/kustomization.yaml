apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Donetick is a Helm chart Application, so the root app-of-apps also creates
# the namespace and the sealed secret that the chart consumes.
resources:
  - namespace.yaml
  - guardrails.yaml
  - networkpolicy.yaml
  - donetick-sealed-secret.yaml
  - application.yaml
