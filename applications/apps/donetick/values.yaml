global:
  labels:
    # Argo CD uses label tracking in this cluster. Adding the tracking label
    # here keeps all chart resources owned by the donetick Application.
    argocd.argoproj.io/instance: donetick

defaultPodOptions:
  labels:
    requires-db: postgres

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

controllers:
  donetick:
    type: deployment

    containers:
      app:
        image:
          repository: donetick/donetick
          tag: v0.1.86
          pullPolicy: IfNotPresent

        env:
          TZ: America/New_York

          DT_ENV: selfhosted

          DT_DATABASE_TYPE: postgres
          DT_DATABASE_HOST: postgres-headless-service.database.svc.cluster.local
          DT_DATABASE_PORT: "5432"
          DT_DATABASE_NAME: donetick
          DT_DATABASE_USER: donetick
          DT_DATABASE_MIGRATION: "true"

          DT_DATABASE_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: donetick-secret
                key: DB_PASSWORD

          DT_JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: donetick-secret
                key: JWT_SECRET

          DT_SERVER_PUBLIC_HOST: https://tasks.lakotko.synology.me
          DT_SERVER_SERVE_FRONTEND: "true"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

        probes:
          liveness:
            enabled: true

          readiness:
            enabled: true

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            memory: 512Mi

service:
  app:
    controller: donetick
    ports:
      http:
        port: 2021

ingress:
  app:
    enabled: true

    className: traefik

    hosts:
      - host: tasks.lakotko.synology.me
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  data:
    enabled: true

    accessMode: ReadWriteOnce

    size: 5Gi

    storageClass: synology-iscsi

    globalMounts:
      - path: /donetick-data
