apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: apps

  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      targetRevision: 3.7.2

      helm:
        valueFiles:
          - $values/applications/apps/donetick/values.yaml

    - repoURL: git@github.com:kevinlacotaco/manifests.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: donetick

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
