apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: apps

  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      targetRevision: 3.7.2

      helm:
        valueFiles:
          - $values/applications/apps/donetick/values.yaml

    - repoURL: git@github.com:kevinlacotaco/manifests.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: donetick

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

  # The resources were originally tracked with the legacy tracking-id
  # annotation. They now use the label configured in argocd-cm, but the old
  # annotation can remain on live objects and show up as a permanent diff.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: ""
      kind: Service
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: apps
      kind: Deployment
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
