apiVersion: apps/v1
kind: Deployment
metadata:
  name: theengs
  namespace: radio
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: theengs
  template:
    metadata:
      labels:
        app: theengs
    spec:
      nodeSelector:
        homelab.io/radios: "true"
      tolerations:
        - key: homelab.io/radios
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: theengs
          image: theengs/gateway:v1.8.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - source /opt/venv/bin/activate && exec /opt/venv/start.sh
          env:
            - name: TZ
              value: America/New_York
            - name: LOG_LEVEL
              value: INFO
            - name: MQTT_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: password
            # Theengs scans every BLE advertisement nearby. Keep the raw MQTT
            # feed, but do not let random devices create Home Assistant entities.
            - name: HASS_DISCOVERY
              value: "false"
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: dbus
              mountPath: /var/run/dbus
            - name: dev
              mountPath: /dev
            - name: watchdog
              mountPath: /shared
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  now=$(date +%s)
                  last=$(cat /shared/last_message 2>/dev/null || true)
                  case "$last" in ''|*[!0-9]*) last=0 ;; esac
                  ok=$(cat /shared/broker_ok 2>/dev/null || true)
                  [ "$ok" = "1" ] || exit 0
                  [ $((now - last)) -lt 900 ]
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: mqtt-watchdog
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/watchdog.sh
          env:
            - name: MQTT_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "home/TheengsGateway/#"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: password
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: watchdog
              mountPath: /shared
            - name: watchdog-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: watchdog
          emptyDir: {}
        - name: watchdog-script
          configMap:
            name: mqtt-watchdog
            defaultMode: 0755
        - name: dbus
          hostPath:
            path: /var/run/dbus
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
