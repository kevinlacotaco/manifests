apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zigbee2mqtt
  namespace: radio
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Zigbee2MQTT"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "zigbee2mqtt.png"
    gethomepage.dev/href: "https://zigbee2mqtt.lakotko.synology.me"
spec:
  ingressClassName: traefik
  rules:
    - host: zigbee2mqtt.lakotko.synology.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zigbee2mqtt
                port:
                  name: http
