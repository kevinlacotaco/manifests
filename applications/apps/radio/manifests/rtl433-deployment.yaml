apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtl433
  namespace: radio
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rtl433
  template:
    metadata:
      labels:
        app: rtl433
    spec:
      nodeSelector:
        homelab.io/radios: "true"
      tolerations:
        - key: homelab.io/radios
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: rtl433
          image: hertzg/rtl_433:25.12
          imagePullPolicy: IfNotPresent
          args:
            - "-Fjson"
            - "-R40"
            - "-Mtime:utc"
            - "-f433920000"
            - "-Fmqtt://rabbitmq.messaging.svc.cluster.local:1883,user=$(MQTT_USER),pass=$(MQTT_PASSWORD),retain=0,devices=rtl_433/grapple/devices[/type][/model][/id][/subtype]/C[channel:0],events=rtl_433/grapple/events"
          env:
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: password
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
            - name: watchdog
              mountPath: /shared
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  now=$(date +%s)
                  last=$(cat /shared/last_message 2>/dev/null || echo 0)
                  ok=$(cat /shared/broker_ok 2>/dev/null || echo 0)
                  [ "$ok" = "0" ] || [ $((now - last)) -lt 600 ]
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: mqtt-watchdog
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/watchdog.sh
          env:
            - name: MQTT_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "rtl_433/grapple/#"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio-mqtt-auth
                  key: password
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: watchdog
              mountPath: /shared
            - name: watchdog-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: watchdog
          emptyDir: {}
        - name: watchdog-script
          configMap:
            name: mqtt-watchdog
            defaultMode: 0755
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
