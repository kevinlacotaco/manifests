apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtarr-downloads
  namespace: youtarr
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: synology-nfs-subdir
  resources:
    requests:
      storage: 200Gi
