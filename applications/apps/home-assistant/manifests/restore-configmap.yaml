apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-restore
  namespace: home-assistant
data:
  restore.py: |
    import json
    import os
    import pathlib
    import tarfile

    config = pathlib.Path("/config")
    marker = config / ".restored-from-nas"

    if not marker.exists():
        print("extracting /backup/migration/homeassistant-config.tgz")
        with tarfile.open("/backup/migration/homeassistant-config.tgz", "r:gz") as archive:
            archive.extractall(config)

        # Trust the in-cluster Traefik proxy in addition to the old NAS proxy.
        config_yaml = config / "configuration.yaml"
        text = config_yaml.read_text()
        anchors = ["    - 192.168.68.71\n", "    - 10.42.0.0/16\n"]
        for extra in anchors:
            if extra not in text:
                text = text.replace("    - 192.168.68.138\n", "    - 192.168.68.138\n" + extra, 1)
        if "\nprometheus:" not in "\n" + text:
            text += "\nprometheus:\n  requires_auth: false\n"
        config_yaml.write_text(text)
    else:
        print("config already restored; refreshing service endpoints")

    # Home Assistant 2026.11 stored a stripped HTTP proxy mask (/32) for
    # pod-network proxies. Repair the persisted HTTP config before startup so
    # Traefik can forward client headers without HA returning HTTP 400.
    http_path = config / ".storage" / "http"
    if http_path.exists():
        http = json.loads(http_path.read_text())
        data = http.get("data", {})
        stable = data.get("stable")
        if isinstance(stable, dict):
            proxies = stable.get("trusted_proxies", [])
            fixed = [
                "10.42.0.0/16" if proxy == "10.42.0.0/32" else proxy
                for proxy in proxies
            ]
            stable["trusted_proxies"] = fixed
            pending = data.get("pending")
            if isinstance(pending, dict):
                pending["trusted_proxies"] = fixed
                pending["error"] = None
                pending["error_message"] = None
            http_path.write_text(json.dumps(http, indent=2) + "\n")
            print("repaired HTTP trusted proxy masks")

    # Always repoint the MQTT and Frigate integrations. This makes the
    # stable mqtt.messaging.svc.cluster.local name authoritative even when
    # the backing MQTT broker is replaced.
    entries_path = config / ".storage" / "core.config_entries"
    entries = json.loads(entries_path.read_text())
    for entry in entries["data"]["entries"]:
        if entry.get("domain") == "mqtt":
            entry["title"] = os.environ["MQTT_HOST"]
            entry["data"]["broker"] = os.environ["MQTT_HOST"]
            entry["data"]["port"] = 1883
            entry["data"]["username"] = os.environ["MQTT_USERNAME"]
            entry["data"]["password"] = os.environ["MQTT_PASSWORD"]
        elif entry.get("domain") == "frigate":
            url = "http://frigate.frigate.svc.cluster.local:5000"
            entry["title"] = "frigate.frigate.svc.cluster.local:5000"
            entry["data"]["url"] = url
            options = entry.setdefault("options", {})
            # The old NAS migration left an RTSP template pointing at
            # 192.168.68.138 and enabled WebRTC with an unreachable go2rtc
            # candidate. Let the integration derive rtsp://<frigate host>:8554
            # from the current service URL and use HLS, which works through the
            # ClusterIP service.
            options["rtsp_url_template"] = ""
            options["enable_webrtc"] = False
    entries_path.write_text(json.dumps(entries, indent=2) + "\n")

    marker.write_text("restored\n")
    print("restore complete")
