apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - guardrails.yaml
  - home-assistant-mqtt-sealed-secret.yaml
  - mealie-api-token-sealed-secret.yaml
  - paperless-api-token-sealed-secret.yaml
  - uptime-kuma-api-key-sealed-secret.yaml
  - restore-configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# configuration.yaml and template entities are maintained in Git under
# applications/apps/home-assistant/config/ and copied into /config by the
# sync-config init container.
configMapGenerator:
  - name: home-assistant-git-config
    options:
      disableNameSuffixHash: true
    files:
      - configuration.yaml=config/configuration.yaml.tpl
      - template-generating_solar.yaml=config/templates/generating_solar.yaml.tpl
      - template-energy_balance.yaml=config/templates/energy_balance.yaml.tpl
      - dashboard-overview.yaml=config/dashboards/overview.yaml.tpl
      - dashboard-climate.yaml=config/dashboards/climate.yaml.tpl
      - dashboard-energy.yaml=config/dashboards/energy.yaml.tpl
      - dashboard-security.yaml=config/dashboards/security.yaml.tpl
      - dashboard-garage.yaml=config/dashboards/garage.yaml.tpl
      - dashboard-media.yaml=config/dashboards/media.yaml.tpl
      - dashboard-systems.yaml=config/dashboards/systems.yaml.tpl
      - dashboard-deliveries.yaml=config/dashboards/deliveries.yaml.tpl
