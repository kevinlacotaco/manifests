apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: restore-config
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /scripts/restore.py
          env:
            - name: MQTT_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-assistant-mqtt
                  key: MQTT_USERNAME
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-assistant-mqtt
                  key: MQTT_PASSWORD
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2024.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: backup
          nfs:
            server: 192.168.68.138
            path: /volume1/k8s-backups
            readOnly: true
        - name: scripts
          configMap:
            name: home-assistant-restore

        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
