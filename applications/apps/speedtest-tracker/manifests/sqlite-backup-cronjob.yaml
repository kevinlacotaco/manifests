apiVersion: batch/v1
kind: CronJob
metadata:
  name: speedtest-tracker-sqlite-backup
  namespace: speedtest-tracker
spec:
  schedule: "40 1 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: speedtest-tracker-sqlite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sqlite-backup
              image: louislam/uptime-kuma:1.23.17
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  mkdir -p /backup-share/staging/sqlite
                  out=/backup-share/staging/sqlite/speedtest-tracker.db
                  rm -f "$out"
                  # SQLite's online backup API produces a consistent copy while
                  # Speedtest Tracker is running.
                  sqlite3 /config/database.sqlite ".timeout 30000" ".backup '$out'"
                  check=$(sqlite3 "$out" "PRAGMA integrity_check;")
                  [ "$check" = "ok" ] || {
                    echo "integrity check failed: $check" >&2
                    exit 1
                  }
                  ls -lh "$out"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: backup-share
                  mountPath: /backup-share
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: speedtest-tracker-config
            - name: backup-share
              nfs:
                server: 192.168.68.138
                path: /volume1/k8s-backups
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
