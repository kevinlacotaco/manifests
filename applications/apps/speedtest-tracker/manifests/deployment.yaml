apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  # The config volume is RWO. Recreate avoids two pods mounting it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speedtest-tracker
  template:
    metadata:
      labels:
        app: speedtest-tracker
        requires-db: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: speedtest-tracker
        image: lscr.io/linuxserver/speedtest-tracker:1.15.1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/New_York
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: speedtest-tracker-secrets
              key: APP_KEY
        - name: ADMIN_NAME
          value: Admin
        - name: ADMIN_EMAIL
          value: admin@lakotko.synology.me
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: speedtest-tracker-secrets
              key: ADMIN_PASSWORD
        - name: APP_URL
          value: https://speedtest.lakotko.synology.me
        - name: APP_TIMEZONE
          value: America/New_York
        - name: DISPLAY_TIMEZONE
          value: America/New_York
        - name: DB_CONNECTION
          value: pgsql
        - name: DB_HOST
          value: postgres-headless-service.database.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE
          value: speedtest
        - name: DB_USERNAME
          value: speedtest
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: speedtest-db
              key: POSTGRES_PASSWORD
        - name: SPEEDTEST_SCHEDULE
          value: 0 * * * *
        - name: PRUNE_RESULTS_OLDER_THAN
          value: '90'
        volumeMounts:
        - name: config
          mountPath: /config
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: apprise
        image: lscr.io/linuxserver/apprise-api:2.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - name: apprise
          containerPort: 8000
          protocol: TCP
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/New_York
        - name: APPRISE_STATELESS_MODE
          value: 'true'
        readinessProbe:
          httpGet:
            path: /status
            port: apprise
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /status
            port: apprise
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: speedtest-tracker-config-v2
