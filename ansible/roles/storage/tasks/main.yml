---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: homelab_storage.nfs_enabled | bool

- name: Install iSCSI client
  ansible.builtin.apt:
    name: open-iscsi
    state: present
  when: homelab_storage.iscsi_enabled | bool

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: homelab_storage.iscsi_enabled | bool
