---
- name: Ensure node_exporter group exists
  ansible.builtin.group:
    name: node_exporter
    system: true

- name: Ensure node_exporter user exists
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_archive }}"
    mode: "0644"

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_archive }}"
    dest: /opt
    remote_src: true
    creates: "{{ node_exporter_install_dir }}"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_install_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0755"

- name: Install Raspberry Pi metrics collector
  ansible.builtin.copy:
    src: raspberry-pi-metrics.sh
    dest: /usr/local/bin/raspberry-pi-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Install Raspberry Pi metrics service
  ansible.builtin.copy:
    src: raspberry-pi-metrics.service
    dest: /etc/systemd/system/raspberry-pi-metrics.service
    owner: root
    group: root
    mode: "0644"

- name: Install Raspberry Pi metrics timer
  ansible.builtin.copy:
    src: raspberry-pi-metrics.timer
    dest: /etc/systemd/system/raspberry-pi-metrics.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start Raspberry Pi metrics timer
  ansible.builtin.systemd:
    name: raspberry-pi-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Collect Raspberry Pi metrics once
  ansible.builtin.command:
    cmd: /usr/local/bin/raspberry-pi-metrics.sh
  changed_when: false
