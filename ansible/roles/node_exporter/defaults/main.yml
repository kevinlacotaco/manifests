---
node_exporter_version: "1.8.2"
node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else ('armv7' if ansible_architecture == 'armv7l' else 'amd64') }}"
node_exporter_install_dir: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_archive: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
node_exporter_listen_address: ":9100"
node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"
