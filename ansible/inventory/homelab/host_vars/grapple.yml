---
# Grapple's systemd-resolved stub (127.0.0.53) times out even though the
# upstream resolvers answer direct queries. Use the AdGuard servers directly,
# matching hauler, so apt and k3s can resolve names.
homelab_resolv_conf_direct: true

k3s_flannel_iface: wlan0
k3s_node_taints:
  - "homelab.io/radios=true:NoSchedule"
k3s_node_labels:
  homelab.io/radios: "true"
  homelab.io/zigbee: "true"
  homelab.io/rtl433: "true"
  homelab.io/bluetooth: "true"

radios_user: kevin

node_capabilities:
  usb: true
  zigbee: true
  rtl433: true
  bluetooth: true

node_hardware:
  usb:
    enabled: true
  zigbee:
    device: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_3846e91f24a6ed11ab23f1a32981d5c7-if00-port0
    vendor_id: "10c4"
    product_id: "ea60"
  rtl433:
    vendor_id: "0bda"
    product_id: "2838"
    frequency: 433920000
  bluetooth:
    vendor_id: "20f4"
    product_id: "110b"
    controller: hci0
